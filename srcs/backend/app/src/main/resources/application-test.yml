spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true

    show-sql: false

jwt:
  secret: test-secret-key-this-is-only-for-testing-do-not-use-in-production
  expirationMs: 300000

logging:
  level:
    root: WARN
    dev.miniExchange: INFO
    org.springframework.test: DEBUG
