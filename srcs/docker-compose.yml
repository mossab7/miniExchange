name: miniExchange

services:
  postgres:
    image: postgres:16-alpine
    container_name: miniExchange_postgres
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miniexchange"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: miniExchange_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
      args:
        RUN_TESTS: ${RUN_TESTS:-false}
    container_name: miniExchange_backend
    env_file:
      - .env
    environment:
      RUN_TESTS: ${RUN_TESTS:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniexchange
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
      MATCHING_ENGINE_HOST: matching-engine
      MATCHING_ENGINE_PORT: 50051
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRADE_EVENTS_TOPIC: trade-events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      matching-engine:
        condition: service_started

  matching-engine:
    build:
      context: .
      dockerfile: matching-engine/Dockerfile
    container_name: miniExchange_matching_engine
    environment:
      RUN_TESTS: ${RUN_TESTS:-false}
      MATCHING_ENGINE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRADE_EVENTS_TOPIC: trade-events
    ports:
      - "50051:50051"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
