syntax = "proto3";

package exchange;

service ExchangeService
{
    rpc SubmitOrder(SubmitOrderRequest)
        returns (OrderResponse);

    rpc CancelOrder(CancelOrderRequest)
        returns (CancelOrderResponse);
}

enum Side
{
    BUY = 0;
    SELL = 1;
}

message SubmitOrderRequest
{
    string symbol = 1;
    uint64 price = 2;
    uint64 quantity = 3;
    Side side = 4;
    string clientId = 5;
}

message OrderResponse
{
    bool accepted = 1;
    string orderId = 2;
    string message = 3;
}

message CancelOrderRequest
{
    string orderId = 1;
}

message CancelOrderResponse
{
    bool success = 1;
    string message = 2;
}
